name: InstaLy client build

on:
  push:
    branches: [client-rebuild]
    paths:
      - 'client/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
  pull_request:
    paths:
      - 'client/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :client:assembleDebug
